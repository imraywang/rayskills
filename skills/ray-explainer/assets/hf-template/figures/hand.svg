  <g fill="none" stroke="#C9AE95" stroke-width="1.8" stroke-linecap="round">
    <path d="M73 180 L74 226"/><path d="M97 180 L99 234"/><path d="M119 180 L122 222"/>
    <path d="M56 204 q6 3 13 0"/><path d="M79 210 q8 3 15 0"/><path d="M103 208 q7 3 14 0"/><path d="M125 200 q6 3 11 0"/>
    <path d="M58 222 q5 2 10 0"/><path d="M82 232 q7 2 12 0"/><path d="M106 228 q6 2 10 0"/>
    <path d="M60 170 q4 -4 8 0"/><path d="M82 172 q5 -4 10 0"/><path d="M104 172 q5 -4 10 0"/><path d="M124 168 q4 -4 8 0"/>
