  <!-- 手背青筋（很淡） -->
  <path d="M78 110 C 80 130, 84 146, 86 164 M104 112 C 104 130, 106 146, 108 164" fill="none" stroke="#D9C3AC" stroke-width="2.4" stroke-linecap="round"/>
