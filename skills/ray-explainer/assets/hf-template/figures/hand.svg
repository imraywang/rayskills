  <path d="M44 150 C 40 160, 36 172, 34 184" fill="none" stroke="#C9AE95" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M26 190 C 28 200, 36 202, 40 194 C 36 196, 30 196, 26 190 Z" fill="#F6ECE2"/>
  <!-- 四指 -->
  <g>
    <path d="M52 174 C 50 200, 50 222, 54 240 C 56 250, 70 250, 72 240 C 74 222, 74 198, 72 176 Z" fill="#EFDCC8"/>
    <path d="M74 176 C 74 204, 74 232, 78 254 C 80 264, 96 264, 98 254 C 100 232, 98 204, 96 178 Z" fill="#F2E1CF"/>
    <path d="M98 178 C 100 204, 100 230, 102 250 C 104 260, 118 260, 120 250 C 122 230, 120 204, 118 178 Z" fill="#EFDCC8"/>
    <path d="M120 176 C 124 196, 126 214, 126 230 C 126 240, 138 240, 140 230 C 142 214, 140 194, 136 174 Z" fill="#E6D1BC"/>
