    <linearGradient id="hdCuff" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2A2C2C"/><stop offset=".5" stop-color="#3A3D3D"/><stop offset="1" stop-color="#262828"/></linearGradient>
  </defs>
  <!-- 袖子 -->
  <path d="M44 0 L136 0 L132 86 L48 86 Z" fill="url(#hdCuff)"/>
  <path d="M60 10 L58 80 M120 10 L122 80" stroke="#1F2121" stroke-width="2"/>
  <rect x="44" y="80" width="92" height="20" rx="4" fill="#0B6B69"/>
  <circle cx="122" cy="90" r="3" fill="#9CC2BF"/>
  <!-- 手腕 + 手背 -->
  <path d="M56 98 L124 98 C 132 120, 140 140, 140 162 C 140 172, 136 178, 130 180 L 50 180 C 42 176, 40 168, 42 156 C 44 136, 50 118, 56 98 Z" fill="url(#hdSkin)"/>
