  <path d="M56 236 C 57 246, 69 246, 70 236 C 66 232, 60 232, 56 236 Z" fill="#F8EEE6" stroke="#D2B9A1" stroke-width="1.2"/>
  <path d="M80 250 C 81 260, 95 260, 96 250 C 92 246, 84 246, 80 250 Z" fill="#F8EEE6" stroke="#D2B9A1" stroke-width="1.2"/>
  <path d="M104 246 C 105 256, 117 256, 118 246 C 114 242, 108 242, 104 246 Z" fill="#F8EEE6" stroke="#D2B9A1" stroke-width="1.2"/>
  <path d="M127 227 C 128 236, 138 236, 139 227 C 135 223, 131 223, 127 227 Z" fill="#F8EEE6" stroke="#D2B9A1" stroke-width="1.2"/>
