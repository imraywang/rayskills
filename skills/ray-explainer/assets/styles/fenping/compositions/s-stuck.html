<template>
  <style>
    @font-face { font-family: "HeiBold"; src: url("assets/fonts/NotoSansSC-700.woff") format("woff"); font-weight: 700; }
    @font-face { font-family: "HeiHeavy"; src: url("assets/fonts/NotoSansSC-900.woff") format("woff"); font-weight: 900; }
    #s-stuck { position: absolute; inset: 0; }
    #s-stuck .panel { position: absolute; left: 0; top: 0; width: 1080px; height: 960px; background: #f3f3f0; overflow: hidden; }
    #s-stuck svg { position: absolute; left: 0; top: 0; width: 1080px; height: 960px; }
    #s-stuck .row { position: absolute; left: 0; right: 0; top: 196px; display: flex; justify-content: center; gap: 18px; }
    #s-stuck .chip { padding: 12px 26px; border-radius: 14px; font-family: "HeiBold", sans-serif; font-size: 38px; }
    #s-stuck .chip.dark { background: #111; color: #f3f3f0; }
    #s-stuck .chip.light { background: #e4e4e0; color: #111; }
    #s-stuck .chip.green { background: #054c4c; color: #f3f3f0; }
  </style>
  <div id="s-stuck" data-composition-id="s-stuck" data-width="1080" data-height="1920">
    <div class="panel">
      <svg id="sk-svg" viewBox="0 0 1080 960"></svg>
      <svg id="sk-eff" style="position:absolute;left:300px;top:206px;width:480px;height:70px" viewBox="0 0 480 70"><text x="0" y="46" font-family="HeiBold" font-size="34" fill="#6e6e6e">效果</text><rect x="100" y="20" width="370" height="30" rx="15" fill="#e4e4e0"/><rect id="sk-bar" x="100" y="20" width="8" height="30" rx="4" fill="#111"/></svg>
    </div>
  </div>
  <script>
    // ---- 渗流网格（边渗流）：每条边一个固定随机数 u，打通比例 p 时 u<p 的边是通的；从顶行出发能走到的节点算「毒气到达」 ----
    function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
    function makeGrid(svgId, C, R, seed, x0, y0, gap) {
      const NS = "http://www.w3.org/2000/svg", svg = document.getElementById(svgId), rnd = mulberry32(seed);
      const gE = document.createElementNS(NS, "g"), gN = document.createElementNS(NS, "g");
      svg.appendChild(gE); svg.appendChild(gN);
      const edges = [], nodes = [];
      for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
        const n = document.createElementNS(NS, "circle");
        n.setAttribute("cx", x0 + c * gap); n.setAttribute("cy", y0 + r * gap); n.setAttribute("r", 6); n.setAttribute("fill", "#b8b8b4");
        gN.appendChild(n); nodes.push(n);
        const add = (b, x2, y2) => {
          const l = document.createElementNS(NS, "line");
          l.setAttribute("x1", x0 + c * gap); l.setAttribute("y1", y0 + r * gap); l.setAttribute("x2", x2); l.setAttribute("y2", y2);
          l.setAttribute("stroke-linecap", "round"); gE.appendChild(l);
          edges.push({ a: r * C + c, b, u: rnd(), el: l });
        };
        if (c < C - 1) add(r * C + c + 1, x0 + (c + 1) * gap, y0 + r * gap);
        if (r < R - 1) add((r + 1) * C + c, x0 + c * gap, y0 + (r + 1) * gap);
      }
      return { C, R, edges, nodes, gE, gN };
    }
    function reach(G, p) {
      const N = G.C * G.R, adj = Array.from({ length: N }, () => []);
      for (const e of G.edges) if (e.u < p) { adj[e.a].push(e.b); adj[e.b].push(e.a); }
      const seen = new Uint8Array(N), q = [];
      for (let c = 0; c < G.C; c++) { seen[c] = 1; q.push(c); }
      while (q.length) { const n = q.pop(); for (const m of adj[n]) if (!seen[m]) { seen[m] = 1; q.push(m); } }
      let span = false; for (let c = 0; c < G.C; c++) if (seen[(G.R - 1) * G.C + c]) span = true;
      return { seen, span };
    }
    function critical(G) {
      const us = G.edges.map((e) => e.u).sort((a, b) => a - b);
      let lo = 0, hi = us.length - 1;
      while (lo < hi) { const m = (lo + hi) >> 1; if (reach(G, us[m] + 1e-9).span) hi = m; else lo = m + 1; }
      return { pc: us[lo], us, index: lo };
    }
    // 画出 p 时的状态；gas=true 时标出毒气到达的部分，贯通时整片变墨绿
    function paint(G, p, opt = {}) {
      const { seen, span } = reach(G, p);
      const gasCol = span ? (opt.spanCol || "#054c4c") : (opt.wetCol || "#8c8c8c");
      let open = 0;
      for (const e of G.edges) {
        const on = e.u < p; if (on) open++;
        const wet = opt.gas && on && seen[e.a] && seen[e.b];
        e.el.setAttribute("stroke", wet ? gasCol : on ? (opt.openCol || "#111") : (opt.closedCol || "#dddcd8"));
        e.el.setAttribute("stroke-width", wet ? 9 : on ? 5 : 3);
      }
      G.nodes.forEach((n, i) => {
        const wet = opt.gas && seen[i];
        n.setAttribute("fill", wet ? gasCol : "#b8b8b4"); n.setAttribute("r", wet ? 9 : 6);
      });
      return { open: open / G.edges.length, span };
    }
    // 场景从 108.6 秒开始。同一张分屏网格（种子 64）：先零零星星打通几条，再悄悄连成片，只差最后三条
    const G = makeGrid("sk-svg", 12, 7, 64, 188, 330, 64);
    const crit = critical(G);
    const pEnd = crit.us[crit.index - 3] + 1e-6;          // 还差 3 条就贯通
    const last = G.edges.filter((e) => e.u >= pEnd && e.u <= crit.pc).map((e) => e.el);
    const st = { p: 0.3 };
    const show = () => paint(G, st.p, { gas: true });
    show();
    const tl = gsap.timeline({ paused: true });
    // 「你单独地打通了三条五条」：一下一下地打通
    [1.3, 1.8, 2.3].forEach((t, i) => tl.to(st, { p: 0.33 + i * 0.03, duration: 0.15, ease: "none", onUpdate: show }, t));
    tl.fromTo("#sk-eff", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 2.78);
    // 「但是这些通道其实都是在悄悄地连起来」
    tl.to(st, { p: pEnd, duration: 2.9, ease: "power1.inOut", onUpdate: show }, 5.92);
    // 「差的只是最后这几条」：还没打通的三条闪墨绿虚线
    tl.fromTo(last, { attr: { stroke: "#dddcd8", "stroke-width": 3, "stroke-dasharray": "0" } },
      { attr: { stroke: "#054c4c", "stroke-width": 8, "stroke-dasharray": "10 8" }, duration: 0.2 }, 9.0);
    tl.to(last, { opacity: 0.25, duration: 0.25, yoyo: true, repeat: 5, ease: "sine.inOut" }, 9.3);
    window.__timelines["s-stuck"] = tl;
  </script>
</template>
