<template>
  <style>
    @font-face { font-family: "Hei"; src: url("assets/fonts/NotoSansSC-500.woff") format("woff"); font-weight: 500; }
    @font-face { font-family: "HeiBold"; src: url("assets/fonts/NotoSansSC-700.woff") format("woff"); font-weight: 700; }
    @font-face { font-family: "HeiHeavy"; src: url("assets/fonts/NotoSansSC-900.woff") format("woff"); font-weight: 900; }
    #s-mask { position: absolute; inset: 0; background: #fff; overflow: hidden; }
    #s-mask .photo { position: absolute; left: 0; top: 230px; width: 1080px; height: 1080px; overflow: hidden; background: #fff; }
    #s-mask .photo img { position: absolute; left: 0; top: 0; width: 1080px; height: 1080px; object-fit: cover; transform-origin: 24% 74%; }
    #s-mask .chip { position: absolute; left: 0; right: 0; top: 214px; text-align: center; }
    #s-mask .chip span { display: inline-block; padding: 12px 28px; border-radius: 14px; background: #111; color: #f3f3f0; font-family: "HeiBold", sans-serif; font-size: 40px; }
    #s-mask .tubes { position: absolute; inset: 0; background: #f3f3f0; }
    #s-mask .gas { position: absolute; left: 120px; right: 120px; top: 330px; height: 70px; border-radius: 35px; background: #8c8c8c; }
    #s-mask .gas-lab { position: absolute; left: 0; right: 0; top: 342px; text-align: center; font-family: "HeiBold", sans-serif; font-size: 36px; color: #f3f3f0; }
    #s-mask .q { position: absolute; left: 0; right: 0; top: 1060px; text-align: center; font-family: "HeiHeavy", sans-serif; font-size: 64px; color: #111; }
  </style>
  <div id="s-mask" data-composition-id="s-mask" data-width="1080" data-height="1920">
    <div id="mk-photo" class="photo clip" data-start="0" data-duration="4.1">
      <img id="mk-img" src="assets/img/gasmask_obj.jpg" alt="" />
    </div>
    <div id="mk-chip1" class="chip clip" data-start="0" data-duration="4.1"><span>↙ 滤毒罐</span></div>
    <div id="mk-tubes" class="tubes clip" data-start="4.0" data-duration="6.25">
      <svg viewBox="0 0 1080 1920" style="position:absolute;inset:0">
        <g id="mk-paths" fill="none" stroke="#111" stroke-width="16" stroke-linecap="round"></g>
        <g id="mk-plugs" fill="#8c8c8c"></g>
      </svg>
      <div id="mk-gas" class="gas"></div>
      <div id="mk-gas-lab" class="gas-lab">毒气</div>
    </div>
  </div>
  <script>
    // 场景从 70.1 秒开始。九条弯曲细管代表滤芯里的通道，固定几条中途被堵
    const NS = "http://www.w3.org/2000/svg";
    const paths = document.getElementById("mk-paths");
    const plugs = document.getElementById("mk-plugs");
    const blocked = { 1: 0.45, 3: 0.3, 4: 0.7, 6: 0.55, 8: 0.38 };
    for (let k = 0; k < 9; k++) {
      const x = 170 + k * 92;
      const amp = 18 + (k % 3) * 8;
      let d = `M ${x} 430`;
      for (let y = 470; y <= 990; y += 40) d += ` Q ${x + (y / 40 % 2 ? amp : -amp)} ${y - 20} ${x} ${y}`;
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", d); p.setAttribute("class", "tube"); p.setAttribute("pathLength", "1");
      p.setAttribute("stroke-dasharray", "1"); paths.appendChild(p);
      if (blocked[k] !== undefined) {
        const c = document.createElementNS(NS, "rect");
        c.setAttribute("x", x - 22); c.setAttribute("y", 430 + blocked[k] * 560 - 16);
        c.setAttribute("width", 44); c.setAttribute("height", 32); c.setAttribute("rx", 10);
        c.setAttribute("class", "plug"); plugs.appendChild(c);
      }
    }
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#mk-img", { scale: 1.0 }, { scale: 1.0, duration: 0.01 }, 0);
    tl.fromTo("#mk-chip1", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.4);
    // 「滤芯里面」：推进到滤毒罐
    tl.to("#mk-img", { scale: 2.6, duration: 1.5, ease: "power2.inOut" }, 2.6);
    tl.fromTo("#mk-tubes", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 4.0);
    tl.fromTo("#mk-paths .tube", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.2, ease: "power2.out", stagger: 0.06 }, 4.3);
    // 「有的通，有的堵」
    tl.fromTo("#mk-plugs .plug", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.25, ease: "back.out(3)", stagger: 0.05 }, 7.58);
    // 「那毒气到底能不能穿过去」
    tl.fromTo(["#mk-gas", "#mk-gas-lab"], { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 8.18);
    window.__timelines["s-mask"] = tl;
  </script>
</template>
